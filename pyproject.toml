[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abm-hfra"
version = "0.2.0"
description = "ABM-IRM application for household flood-risk, insurance, and relocation analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
]

[project.urls]
Repository = "https://github.com/headwind55/ABM-HFRA"

[tool.setuptools.packages.find]
where = ["src"]
